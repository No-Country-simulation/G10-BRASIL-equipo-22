name: MediFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'release-*'
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
      - main
      - 'release-*'

jobs:
  test-and-validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Validação Sintática e Compilação Python
        run: |
          python -m py_compile app.py mediflow_agent.py mediflow_schemas.py oci_storage.py
          python -m py_compile week3/*.py
          python -m py_compile week4/*.py

      - name: 🧪 Executar Bateria de Testes (Semana 3)
        run: |
          pytest week3/test_week3.py -v --tb=short

      - name: ⚡ Executar Bateria de Testes & Carga Concorrente (Semana 4)
        run: |
          pytest week4/test_week4.py -v --tb=short

      - name: 📊 Executar Runner Executivo SRE (Semana 4)
        run: |
          python week4/run_week4_tests.py
